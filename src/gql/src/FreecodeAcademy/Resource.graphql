query resource(
  $where: ResourceWhereUniqueInput!
  $resourceWithDetailes: Boolean = true
) {
  resource(where: $where) {
    ...ResourceDetailed
  }
}

query resources(
  $where: ResourceWhereInput
  $orderBy: ResourceOrderByInput
  $first: Int
  $skip: Int
  $resourceWithDetailes: Boolean = false
) {
  resources(where: $where, orderBy: $orderBy, take: $first, skip: $skip) {
    ...Resource_
  }
}

query resourcesConnection(
  $first: Int
  $orderBy: ResourceOrderByInput
  $skip: Int
  $where: ResourceWhereInput
  $resourceWithDetailes: Boolean = false
) {
  resourcesCount(where: $where)
  resources(take: $first, orderBy: $orderBy, skip: $skip, where: $where) {
    ...Resource_
  }
}

mutation createResource(
  $data: ResourceCreateInput!
  $resourceWithDetailes: Boolean = true
) {
  response: createResource(data: $data) {
    ...Resource_
  }
}

mutation updateResource(
  $data: ResourceUpdateDataInput!
  $where: ResourceWhereUniqueInput!
  $resourceWithDetailes: Boolean = true
) {
  response: updateResource(data: $data, where: $where) {
    ...Resource_
  }
}

fragment ResourceNoNesting on Resource {
  id
  createdAt
  updatedAt
  type
  name
  longtitle
  # content
  intro
  # components
  # contentText
  published
  deleted
  # hidemenu
  searchable
  uri
  # isfolder
  # rating
  # positiveVotesCount
  # negativeVotesCount
  # neutralVotesCount
  # oldID
  # commentOldID
  # class_key
  # template
  # mockUpdate

  createdById

  image

  ... @include(if: $resourceWithDetailes) {
    contentV2
  }
}

fragment Resource_ on Resource {
  ...ResourceNoNesting
  CreatedBy {
    ...UserNoNesting
  }
