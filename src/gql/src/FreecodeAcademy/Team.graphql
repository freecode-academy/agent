query team($where: TeamWhereUniqueInput!) {
  team(where: $where) {
    ...Team_
  }
}

query teams(
  $where: TeamWhereInput
  $orderBy: TeamOrderByInput
  $take: Int
  $skip: Int
) {
  teams(where: $where, orderBy: $orderBy, take: $take, skip: $skip) {
    ...Team_
  }
}

query teamsConnection(
  $take: Int
  $orderBy: TeamOrderByInput
  $skip: Int
  $where: TeamWhereInput
) {
  teamsCount(where: $where)
  teams(take: $take, orderBy: $orderBy, skip: $skip, where: $where) {
    ...Team_
  }
}

mutation createTeam($data: TeamCreateInput!) {
  response: createTeam(data: $data) {
    ...Team_
  }
}

mutation updateTeam($data: TeamUpdateInput!, $where: TeamWhereUniqueInput!) {
  response: updateTeam(data: $data, where: $where) {
    ...Team_
  }
}

fragment TeamNoNesting on Team {
  id
  name
  status
  createdAt
  updatedAt
  website
  address
  email
  phone
  createdById
}

fragment Team_ on Team {
  ...TeamNoNesting
  CreatedBy {
    ...UserNoNesting
  }
  Members {
    ...TeamMemberNoNesting
    User {
      ...UserNoNesting
    }
  }
}

fragment TeamDetailed on Team {
  ...Team_

  content
}
