query projectsConnection(
  $first: Int = 10
  $skip: Int
  $where: ProjectWhereInput # $orderBy: [ProjectOrderByWithRelationInput!] = { createdAt: desc }
) {
  projectsCount(where: $where)
  projects(
    # orderBy: $orderBy,
    take: $first
    skip: $skip
    where: $where
  ) {
    ...projectsConnectionProject
  }
}

mutation createProject($data: ProjectCreateInput!) {
  response: createProject(data: $data) {
    ...Project_
  }
}

mutation updateProject(
  $data: ProjectUpdateInput!
  $where: ProjectWhereUniqueInput!
) {
  response: updateProject(data: $data, where: $where) {
    ...Project_
  }
}

fragment projectsConnectionProject on Project {
  ...Project_

