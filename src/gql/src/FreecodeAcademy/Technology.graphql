query technology(
  $where: TechnologyWhereUniqueInput!
  $withLearnStrategies: Boolean = false
  $technologyWithDetails: Boolean = true
) {
  object: technology(where: $where) {
    ...Technology_
  }
}

query technologies(
  $take: Int
  $skip: Int
  $where: TechnologyWhereInput # $orderBy: [TechnologyOrderByWithRelationInput!] = { createdAt: desc }
  $withLearnStrategies: Boolean = false
  $technologyWithDetails: Boolean = false
) {
  technologies(take: $take, skip: $skip, where: $where) {
    ...Technology_
  }
}

query technologiesConnection(
  $take: Int
  $skip: Int
  $where: TechnologyWhereInput # $orderBy: [TechnologyOrderByWithRelationInput!] = { createdAt: desc }
  $withLearnStrategies: Boolean = false
  $technologyWithDetails: Boolean = false
) {
  technologiesCount(where: $where)
  technologies(take: $take, skip: $skip, where: $where) {
    ...Technology_
  }
}

mutation createTechnology(
  $data: TechnologyCreateInput!
  $withLearnStrategies: Boolean = false
  $technologyWithDetails: Boolean = false
) {
  response: createTechnology(data: $data) {
    ...Technology_
  }
}

mutation updateTechnology(
  $data: TechnologyUpdateInput!
  $where: TechnologyWhereUniqueInput!
  $withLearnStrategies: Boolean = false
  $technologyWithDetails: Boolean = false
) {
  response: updateTechnology(data: $data, where: $where) {
    ...Technology_
  }
}

fragment Technology_ on Technology {
  ...TechnologyNoNesting

  CreatedBy {
    ...UserNoNesting
  }

  ... @include(if: $technologyWithDetails) {
    UserTechnologies {
      ...UserTechnologyNoNesting
      CreatedBy {
        ...UserNoNesting
      }
    }
  }
  LearnStrategyStages @include(if: $withLearnStrategies) {
    ...learnStrategyStageNoNesting
    LearnStrategy {
      ...LearnStrategyNoNesting
    }
  }
}

fragment TechnologyNoNesting on Technology {
  id
  createdAt
  updatedAt
  name
  description
  # components
  # contentText
  content
  site_url
  level1hours
  level2hours
  level3hours
  level4hours
  level5hours
}
