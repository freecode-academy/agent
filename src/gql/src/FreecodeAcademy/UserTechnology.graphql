mutation createUserTechnology($data: UserTechnologyCreateInput!) {
  response: createUserTechnology(data: $data) {
    ...UserTechnology_
  }
}

mutation updateUserTechnology(
  $data: UserTechnologyUpdateInput!
  $where: UserTechnologyWhereUniqueInput!
) {
  response: updateUserTechnology(data: $data, where: $where) {
    ...UserTechnology_
  }
}

mutation deleteUserTechnology($where: UserTechnologyWhereUniqueInput!) {
  response: deleteUserTechnology(where: $where) {
    id
  }
}

fragment UserTechnology_ on UserTechnology {
  ...UserTechnologyNoNesting
  CreatedBy {
    ...UserNoNesting
  }
}

fragment UserTechnologyNoNesting on UserTechnology {
  id
  createdAt
  updatedAt
  date_from
  date_till
  status
  hiring_status
  level
  technologyId
  isMentor
  # components
}
