query codeChallengeBlocks(
  $where: CodeChallengeBlockWhereInput
  $orderBy: CodeChallengeBlockOrderByInput
  $take: Int
  $skip: Int
  $codeChallengeBlockWithDetails: Boolean = false
) {
  codeChallengeBlocks(
    where: $where
    orderBy: $orderBy
    take: $take
    skip: $skip
  ) {
    ...CodeChallengeBlock_
  }
}

query codeChallengeBlock(
  $where: CodeChallengeBlockWhereUniqueInput!
  $codeChallengeBlockWithDetails: Boolean = true
) {
  object: codeChallengeBlock(where: $where) {
    ...CodeChallengeBlock_
  }
}

fragment CodeChallengeBlock_ on CodeChallengeBlock {
  ...CodeChallengeBlockNoNesting

  ... @include(if: $codeChallengeBlockWithDetails) {
    Challenges {
      ...CodeChallengeNoNestiong
    }
    Children {
      ...CodeChallengeBlockNoNesting
      Challenges {
        ...CodeChallengeNoNestiong
      }
    }
  }
}

fragment CodeChallengeBlockNoNesting on CodeChallengeBlock {
  id
  # externalKey
  # createdAt
  # updatedAt
  name
  # rank
}

