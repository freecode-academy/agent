query me($withUserTechnologies: Boolean = true) {
  me {
    ...meUser
  }
}

query user(
  $where: UserWhereUniqueInput!
  $withUserTechnologies: Boolean = false
) {
  object: user(where: $where) {
    ...User_
  }
}

query usersConnection(
  $where: UserWhereInput
  $skip: Int
  $first: Int = 10
  $withUserTechnologies: Boolean = false
) {
  usersCount(where: $where)
  users(where: $where, skip: $skip, take: $first) {
    ...User_
  }
}

mutation updateCurrentUser(
  $data: CurrentUserUpdateInput!
  $withUserTechnologies: Boolean = false
) {
  response: updateCurrentUser(data: $data) {
    ...User_
  }
}

mutation updateUser(
  $data: UserUpdateDataInput!
  $where: UserWhereUniqueInput!
  $withUserTechnologies: Boolean = false
) {
  updateUser(data: $data, where: $where) {
    ...User_
  }
}

mutation signin($where: UserWhereUniqueInput!, $data: UserSigninDataInput!) {
  response: signin(where: $where, data: $data) {
    success
    message
    token
  }
}

mutation signup($data: UserSignupDataInput!) {
  response: signup(data: $data) {
    success
    message
    token
  }
}

mutation createReferrerToken {
  createReferrerToken
}

fragment meUser on User {
  ...User_

  EthAccount {
    ...EthAccountNoNesting
  }

  TelegramAccount {
    ...TelegramAccountNoNesting
  }

  Balance {
    ...BalanceNoNesting
  }
}

fragment User_ on User {
  ...UserNoNesting

  content

  UserTechnologies @include(if: $withUserTechnologies) {
    ...UserTechnologyNoNesting
    Technology {
      ...TechnologyNoNesting
    }
  }
}

fragment UserNoNesting on User {
  id
  createdAt
  updatedAt
  username
  fullname
  image
  sudo
  status
  intro

  title: fullname
}
